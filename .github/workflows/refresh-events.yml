name: Refresh Luma Events

on:
  schedule:
    # Once a day at noon UTC (9 AM Chile time)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit events.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch events from Luma iCal
        run: node scripts/fetch-events.mjs

      - name: Fetch speakers from Google Sheets
        run: node scripts/fetch-speakers.mjs

      - name: Commit updated data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/events.json scripts/og-cache.json public/speakers.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: refresh events and speakers"
            git push
          fi
